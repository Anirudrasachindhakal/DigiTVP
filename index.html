<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticket to Puja 💌</title>
  <style>
    body {
      background: linear-gradient(135deg, #ffe0ec, #ffd5f3);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      max-width: 500px;
    }

    .emoji {
      font-size: 48px;
      animation: heartbeat 1.5s infinite;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.3);
      }
    }

    .message {
      font-size: 18px;
      margin-top: 20px;
      animation: fadeIn 2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .typewriter {
      overflow: hidden;
      border-right: .15em solid #e75480;
      white-space: nowrap;
      margin: 0 auto;
      letter-spacing: .1em;
      animation: typing 3s steps(40, end), blink-caret .75s step-end infinite;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }

    @keyframes blink-caret {
      from, to { border-color: transparent }
      50% { border-color: #e75480; }
    }

    .photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 3px solid #ff79c6;
      box-shadow: 0 0 10px #ffb6c1;
    }

    h3 {
      color: #ff1493;
      margin: 10px 0 0 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src=""Anirudrasachindhakal-patch-1-miss puja.png"" alt="Miss Puja" class="photo" />
    <div class="emoji">💘</div>
    <h2 class="typewriter">This ticket brought you to me 💖</h2>
    <p class="message">
      And I must say, you’re already the highlight of my day 😌💌<br>
      I only care about your smile
    </p>
    <h3>Issued to: Puja (The Most Beautiful Girl Here)</h3>
  </div>
</body>
</html>
